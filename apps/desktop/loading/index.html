<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixer</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f0f10;
        color: #e8e8ea;
      }
      .wrap {
        text-align: center;
        padding: 2rem;
        max-width: 28rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        opacity: 0.85;
        line-height: 1.5;
      }
      #timeout {
        display: none;
        margin-top: 1rem;
        color: #f0a060;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Starting Fixer…</h1>
      <p id="status">Loading the app.</p>
      <p id="timeout">Still starting. If this persists, quit and try again.</p>
    </div>
    <script>
      window.__fixerShowStartupTimeout = function () {
        document.getElementById('timeout').style.display = 'block';
        document.getElementById('status').textContent = 'Taking longer than expected.';
      };
    </script>
  </body>
</html>
