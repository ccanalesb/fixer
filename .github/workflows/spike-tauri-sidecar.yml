name: Spike Tauri sidecar (#413)

on:
  push:
    branches: [spike/tauri-sidecar]

jobs:
  spike-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Linux system deps (Tauri / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf xvfb
      - name: Build packaged spike
        working-directory: spike/tauri
        run: |
          npm ci
          npm run build:release
      - name: Package / install sizes
        working-directory: spike/tauri
        run: |
          du -sh src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | tee spike-linux-installer-size.txt || true
          du -sh src-tauri/target/release/lt-tauri-spike 2>/dev/null | tee spike-linux-binary-size.txt || true
      - name: Run packaged smoke (xvfb)
        working-directory: spike/tauri
        env:
          SPIKE_OUTPUT_JSON: ${{ github.workspace }}/spike-result-linux.json
        run: xvfb-run -a npm run smoke:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-tauri-linux-log
          path: |
            spike/tauri/spike-linux-installer-size.txt
            spike/tauri/spike-linux-binary-size.txt
            spike-result-linux.json
          retention-days: 7

  spike-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build packaged spike
        working-directory: spike/tauri
        shell: bash
        run: |
          npm ci
          npm run build:release
      - name: Package sizes
        working-directory: spike/tauri
        shell: bash
        run: |
          du -sh src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | tee spike-win-installer-size.txt || true
          du -sh src-tauri/target/release/lt-tauri-spike.exe 2>/dev/null | tee spike-win-binary-size.txt || true
      - name: Run packaged smoke
        working-directory: spike/tauri
        shell: bash
        env:
          SPIKE_OUTPUT_JSON: ${{ github.workspace }}/spike-result-windows.json
        run: npm run smoke:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-tauri-windows-log
          path: |
            spike/tauri/spike-win-installer-size.txt
            spike/tauri/spike-win-binary-size.txt
            spike-result-windows.json
          retention-days: 7
