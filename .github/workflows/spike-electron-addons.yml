name: Spike electron native addons (#401)

on:
  push:
    branches: [spike/electron-addons]

jobs:
  spike-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install spike deps and pack
        working-directory: spike/electron
        run: |
          npm ci
          npm run pack:dir
      - name: Run packaged smoke (xvfb)
        working-directory: spike/electron
        env:
          SPIKE_OUTPUT_JSON: ${{ github.workspace }}/spike-result-linux.json
        run: xvfb-run -a npm run smoke:packaged
      - name: Package size
        working-directory: spike/electron
        run: du -sh out/linux-unpacked | tee spike-linux-size.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-linux-log
          path: |
            spike/electron/spike-linux-size.txt
            spike-result-linux.json
          retention-days: 7

  spike-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install spike deps and pack
        working-directory: spike/electron
        shell: bash
        run: |
          npm ci
          npm run pack:dir
      - name: Run packaged smoke
        working-directory: spike/electron
        shell: bash
        env:
          SPIKE_OUTPUT_JSON: ${{ github.workspace }}/spike-result-windows.json
        run: npm run smoke:packaged
      - name: Package size
        working-directory: spike/electron
        shell: bash
        run: du -sh out/win-unpacked | tee spike-win-size.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-windows-log
          path: |
            spike/electron/spike-win-size.txt
            spike-result-windows.json
          retention-days: 7
