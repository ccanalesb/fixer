name: Contract drift gate

on:
  pull_request:
    paths:
      - 'apps/visualizer/**'
      - 'docs/adr/**'
  workflow_call:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24, not 20: apps/visualizer/backend sets "engines": { "node": ">=24" }
      # and uses node:sqlite-era flags such as --env-file-if-exists.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The backend is the source of the OpenAPI document, so its dependencies
      # are needed even for the frontend's codegen step.
      - name: Install backend dependencies
        working-directory: apps/visualizer/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/visualizer/frontend
        run: npm ci --legacy-peer-deps

      - name: Regenerate OpenAPI types and fail on drift
        working-directory: apps/visualizer/frontend
        run: |
          npm run generate:api
          git diff --exit-code src/types/api.gen.ts

      - name: Typecheck frontend
        working-directory: apps/visualizer/frontend
        run: npx tsc --noEmit

      # tsc proves the types line up; it does not prove the UI still behaves.
      # Added while removing surfaces from the frontend (map #218) -- those
      # slices are almost entirely frontend, and without this the only gate on
      # them was a typecheck.
      - name: Frontend tests
        working-directory: apps/visualizer/frontend
        run: npx vitest run --retry=2

      - name: Typecheck backend
        working-directory: apps/visualizer/backend
        run: npm run typecheck

      # This ran a hand-maintained list (tests/contract-tests.txt) while the
      # backend was Python, because CI could only afford a subset of a 438-test
      # pytest suite. Vitest runs the whole suite in ~20s, so the list is gone:
      # an agent removing a surface now deletes its test file and nothing else,
      # which is what the list was working around.
      #
      # The parity suites are NOT run here. They are gated on the user's real
      # 638 MB library.db (LT_CATALOG_PARITY / LT_CLIP_PARITY) and skip without it.
      - name: Backend tests
        working-directory: apps/visualizer/backend
        run: npm test
