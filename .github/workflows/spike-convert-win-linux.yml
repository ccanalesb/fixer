# Spike for issue #405 — throwaway branch only. Never merge.
name: Spike convert win/linux (405)

on:
  push:
    branches:
      - spike/convert-win-linux

concurrency:
  group: spike/convert-win-linux
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            id: linux
            hide_git: false
          - runner: ubuntu-latest
            id: linux-no-git
            hide_git: true
          - runner: windows-latest
            id: windows
            hide_git: false
          - runner: macos-latest
            id: macos-arm64
            hide_git: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Spike paths (runner temp; override setup-uv cache dir)
        shell: bash
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"
          echo "HF_HOME=${RUNNER_TEMP}/hf-home" >> "$GITHUB_ENV"
          echo "SPIKE_OUT_DIR=${RUNNER_TEMP}/spike-model-out" >> "$GITHUB_ENV"
          echo "SPIKE_LOG_DIR=${RUNNER_TEMP}/spike-logs" >> "$GITHUB_ENV"
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"

      - name: Prepare log dir
        shell: bash
        run: mkdir -p "$SPIKE_LOG_DIR" "$UV_CACHE_DIR" "$HF_HOME"

      - name: Record uv version
        shell: bash
        run: |
          echo "UV_EXECUTABLE=$(command -v uv)" >> "$GITHUB_ENV"
          uv --version | tee "$SPIKE_LOG_DIR/uv-version.txt"

      - name: Resolve script env (verbose)
        shell: bash
        run: |
          set -euo pipefail
          uv_no_git() {
            if [ "${{ matrix.hide_git }}" = "true" ]; then
              UV_DIR="$(dirname "$UV_EXECUTABLE")"
              if PATH="${UV_DIR}:/usr/local/bin" command -v git >/dev/null 2>&1; then
                echo "git still on PATH during uv (resolve)" >&2
                exit 1
              fi
              echo "git not on PATH during uv resolve (ok)" >> "$SPIKE_LOG_DIR/git-hidden.txt"
              PATH="${UV_DIR}:/usr/local/bin" UV_LOG=info uv run "$@"
            else
              UV_LOG=info uv run "$@"
            fi
          }
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "resolve_start=$START" >> "$SPIKE_LOG_DIR/timing.env"
          uv_no_git scripts/app-models/export_onnx.py --help 2>&1 | tee "$SPIKE_LOG_DIR/uv-resolve.log"
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "resolve_end=$END" >> "$SPIKE_LOG_DIR/timing.env"
          if grep -qi 'git+https' "$SPIKE_LOG_DIR/uv-resolve.log"; then
            echo "uv resolve log mentions git+https (unexpected)" >&2
            exit 1
          fi

      - name: Cache sizes after resolve
        shell: bash
        run: |
          set -euo pipefail
          du -sh "$UV_CACHE_DIR" 2>/dev/null | tee "$SPIKE_LOG_DIR/uv-cache-after-resolve.txt" || echo "0 uv-cache" | tee "$SPIKE_LOG_DIR/uv-cache-after-resolve.txt"
          du -sh "$HF_HOME" 2>/dev/null | tee "$SPIKE_LOG_DIR/hf-cache-after-resolve.txt" || echo "0 hf-cache" | tee "$SPIKE_LOG_DIR/hf-cache-after-resolve.txt"

      - name: Convert thaitea/laya-vision (parity included)
        shell: bash
        run: |
          set -euo pipefail
          uv_no_git() {
            if [ "${{ matrix.hide_git }}" = "true" ]; then
              UV_DIR="$(dirname "$UV_EXECUTABLE")"
              if PATH="${UV_DIR}:/usr/local/bin" command -v git >/dev/null 2>&1; then
                echo "git still on PATH during uv (convert)" >&2
                exit 1
              fi
              echo "git not on PATH during uv convert (ok)" >> "$SPIKE_LOG_DIR/git-hidden.txt"
              PATH="${UV_DIR}:/usr/local/bin" uv run "$@"
            else
              uv run "$@"
            fi
          }
          mkdir -p "$SPIKE_OUT_DIR"
          CONV_START=$(date +%s)
          echo "convert_start_epoch=$CONV_START" >> "$SPIKE_LOG_DIR/timing.env"
          if [ "${{ matrix.runner }}" = "ubuntu-latest" ] && [ "${{ matrix.hide_git }}" = "false" ]; then
            /usr/bin/time -v uv run scripts/app-models/export_onnx.py thaitea/laya-vision --name laya-base --out "$SPIKE_OUT_DIR" 2>&1 | tee "$SPIKE_LOG_DIR/convert.log"
          elif [ "${{ matrix.runner }}" = "ubuntu-latest" ]; then
            uv_no_git scripts/app-models/export_onnx.py thaitea/laya-vision --name laya-base --out "$SPIKE_OUT_DIR" 2>&1 | tee "$SPIKE_LOG_DIR/convert.log"
          elif [ "${{ matrix.runner }}" = "macos-latest" ]; then
            /usr/bin/time -l uv run scripts/app-models/export_onnx.py thaitea/laya-vision --name laya-base --out "$SPIKE_OUT_DIR" 2>&1 | tee "$SPIKE_LOG_DIR/convert.log"
          else
            uv run scripts/app-models/export_onnx.py thaitea/laya-vision --name laya-base --out "$SPIKE_OUT_DIR" 2>&1 | tee "$SPIKE_LOG_DIR/convert.log"
          fi
          CONV_END=$(date +%s)
          echo "convert_end_epoch=$CONV_END" >> "$SPIKE_LOG_DIR/timing.env"
          echo "convert_wall_seconds=$((CONV_END - CONV_START))" >> "$SPIKE_LOG_DIR/timing.env"

      - name: Cache sizes after conversion
        shell: bash
        run: |
          set -euo pipefail
          du -sh "$UV_CACHE_DIR" | tee "$SPIKE_LOG_DIR/uv-cache-after-convert.txt"
          du -sh "$HF_HOME" | tee "$SPIKE_LOG_DIR/hf-cache-after-convert.txt"
          du -sh "$SPIKE_OUT_DIR" | tee "$SPIKE_LOG_DIR/local-out-size.txt"

      - name: Summarize spike metrics (text only)
        if: always()
        shell: bash
        env:
          MATRIX_ID: ${{ matrix.id }}
          MATRIX_RUNNER: ${{ matrix.runner }}
          HIDE_GIT: ${{ matrix.hide_git }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, re, pathlib
          log = pathlib.Path(os.environ["SPIKE_LOG_DIR"])
          timing = {}
          te = log / "timing.env"
          if te.exists():
              for line in te.read_text().splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      timing[k] = v
          convert_log = (log / "convert.log").read_text(errors="replace") if (log / "convert.log").exists() else ""
          peak_kib = None
          m = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", convert_log)
          if m:
              peak_kib = int(m.group(1))
          else:
              m = re.search(r"\s+(\d+)\s+maximum resident set size", convert_log)
              if m:
                  peak_kib = int(int(m.group(1)) / 1024)  # macOS /usr/bin/time -l uses bytes
          def du_file(name):
              p = log / name
              return p.read_text().strip() if p.exists() else ""
          summary = {
              "platform": os.environ["MATRIX_ID"],
              "runner": os.environ["MATRIX_RUNNER"],
              "hide_git": os.environ["HIDE_GIT"] == "true",
              "outcome": os.environ["JOB_STATUS"],
              "timing": timing,
              "peak_rss_kib": peak_kib,
              "uv_cache_after_resolve": du_file("uv-cache-after-resolve.txt"),
              "hf_cache_after_resolve": du_file("hf-cache-after-resolve.txt"),
              "uv_cache_after_convert": du_file("uv-cache-after-convert.txt"),
              "hf_cache_after_convert": du_file("hf-cache-after-convert.txt"),
              "local_out_size": du_file("local-out-size.txt"),
              "done_line": next((ln for ln in convert_log.splitlines() if ln.startswith("done:")), None),
              "error_line": next((ln for ln in convert_log.splitlines() if ln.startswith("error:")), None),
          }
          out = log / f"spike-{os.environ['MATRIX_ID']}-summary.json"
          out.write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload spike summary only (ADR-0020)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-405-${{ matrix.id }}-logs
          path: |
            ${{ runner.temp }}/spike-logs/spike-${{ matrix.id }}-summary.json
            ${{ runner.temp }}/spike-logs/uv-resolve.log
            ${{ runner.temp }}/spike-logs/convert.log
            ${{ runner.temp }}/spike-logs/timing.env
            ${{ runner.temp }}/spike-logs/uv-cache-*.txt
            ${{ runner.temp }}/spike-logs/hf-cache-*.txt
            ${{ runner.temp }}/spike-logs/git-hidden.txt
          retention-days: 14
